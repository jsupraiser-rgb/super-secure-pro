<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Super Secure Pro - OST Security Services</title>
  
  <!-- Mobile PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020617">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    html, body {
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased h-screen w-screen overflow-hidden select-none">

  <!-- React Mount Point -->
  <div id="root" class="h-full w-full"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // SVG Icon Helper Component
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        shield: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
        home: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
        users: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
        map: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>,
        exclamation: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
        cog: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
        building: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>,
        camera: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
        refresh: <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} className={className}><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
      };
      return icons[name] || null;
    };

    function App() {
      // Local Storage Loaders & Persistence
      const [retentionDays, setRetentionDays] = useState(() => {
        return localStorage.getItem('ost_retention') || '20';
      });

      const [siteDetails, setSiteDetails] = useState(() => {
        const saved = localStorage.getItem('ost_siteDetails');
        return saved ? JSON.parse(saved) : {
          name: 'Unicorn by Chandak',
          type: '18 Storey Commercial Tower',
          address: 'Chandak Unicorn Commercial Hub, Central District',
          gates: '2 Gates (Gate 1 Main Entry, Gate 2 Service)',
          helpline: '+91 98210 25556',
          instructions: 'All visitors & contractors must register at Reception Gate 1. Photo verification & AI record check required.'
        };
      });

      const [users, setUsers] = useState([
        { id: 'usr-1', name: 'Javed Shaikh', role: 'admin', title: 'System Admin', avatar: '🛡️' },
        { id: 'usr-2', name: 'Kishor Ladawte', role: 'supervisor', title: 'Security Supervisor', avatar: '👔' },
        { id: 'usr-3', name: 'Siraj Pathan', role: 'supervisor', title: '2nd Supervisor', avatar: '👔' },
        { id: 'usr-4', name: 'Raju Sonekamble', role: 'night_supervisor', title: 'Night Supervisor', avatar: '🌙' },
        { id: 'usr-5', name: 'Ravi Khandare', role: 'guard', title: 'Security Guard', avatar: '👮' },
        { id: 'usr-6', name: 'Vimal Yadav', role: 'guard', title: 'Security Guard', avatar: '👮' },
        { id: 'usr-7', name: 'Shiv Sevak Yadav', role: 'guard', title: 'Security Guard', avatar: '👮' },
        { id: 'usr-8', name: 'Swapnil Shinde', role: 'guard', title: 'Security Guard', avatar: '👮' },
        { id: 'usr-9', name: 'Suraj Pal', role: 'guard', title: 'Security Guard', avatar: '👮' },
        { id: 'usr-10', name: 'Phool Hasan', role: 'guard', title: 'Security Guard', avatar: '👮' }
      ]);

      const [currentUser, setCurrentUser] = useState(users[0]);
      const [activeTab, setActiveTab] = useState('visitors');
      const [sosActive, setSosActive] = useState(false);
      const [notification, setNotification] = useState(null);
      const [showStaffPicker, setShowStaffPicker] = useState(false);

      // Site Editing
      const [editSite, setEditSite] = useState({ ...siteDetails });
      const [newGuardName, setNewGuardName] = useState('');
      const [newGuardRole, setNewGuardRole] = useState('guard');

      // Camera States
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [capturedPhoto, setCapturedPhoto] = useState(null);
      const [cameraError, setCameraError] = useState(null);
      
      // Visitor Form States
      const [visitorName, setVisitorName] = useState('');
      const [visitorHost, setVisitorHost] = useState('');
      const [visitorPhone, setVisitorPhone] = useState('');
      const [isScanningPhoto, setIsScanningPhoto] = useState(false);

      const [visitors, setVisitors] = useState(() => {
        const saved = localStorage.getItem('ost_visitors');
        return saved ? JSON.parse(saved) : [
          { 
            id: 'vis-1', 
            name: 'Amit Patel', 
            company: 'Amazon Delivery', 
            host: 'Office 402', 
            inTime: '01:45 PM', 
            photo: '👨‍💼', 
            policeCheck: 'CLEARED (No Criminal Record)',
            statusColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
            hostApproval: 'APPROVED BY OFFICE',
            hostApprovalColor: 'text-emerald-400 bg-emerald-950/60 border-emerald-500/30'
          }
        ];
      });

      const [incidents] = useState([
        { id: 'inc-1', title: 'Basement Parking Light Defect', location: 'B2 Parking', reporter: 'Raju Sonekamble', severity: 'medium', time: '02:15 AM' },
        { id: 'inc-2', title: 'Unauthorized Parking Warning', location: 'Gate 2 Entrance', reporter: 'Ravi Khandare', severity: 'low', time: '11:30 AM' }
      ]);

      // Essential Patrolling Duties as Checkpoints
      const checkpoints = [
        'Gate 1 & Gate 2 Security Booth Check',
        'Inspect Basement 1 & 2 Parking & Light Panels',
        'Check Fire Extinguishers & Exit Stairwells',
        'Inspect Water Pump Room & Electrical Substation',
        'Verify Service Loading Dock & Material Gates',
        'Inspect Refuge Areas & 18th Floor Terrace Door Lock'
      ];

      const [scannedPoints, setScannedPoints] = useState(() => {
        const saved = localStorage.getItem('ost_scannedPoints');
        return saved ? JSON.parse(saved) : [];
      });

      // Save Data Effects
      useEffect(() => {
        localStorage.setItem('ost_siteDetails', JSON.stringify(siteDetails));
      }, [siteDetails]);

      useEffect(() => {
        localStorage.setItem('ost_visitors', JSON.stringify(visitors));
      }, [visitors]);

      useEffect(() => {
        localStorage.setItem('ost_scannedPoints', JSON.stringify(scannedPoints));
      }, [scannedPoints]);

      useEffect(() => {
        localStorage.setItem('ost_retention', retentionDays);
      }, [retentionDays]);

      const showNotify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3500);
      };

      const handleSaveSiteDetails = (e) => {
        e.preventDefault();
        setSiteDetails({ ...editSite });
        showNotify(`Site details saved! Retention set to ${retentionDays} Days.`);
      };

      const handleScan = (pt) => {
        if (scannedPoints.includes(pt)) {
          showNotify("Patrol duty already verified!");
          return;
        }
        const updated = [...scannedPoints, pt];
        setScannedPoints(updated);
        showNotify(`Duty Cleared: ${pt}`);
      };

      const handleAddPersonnel = (e) => {
        e.preventDefault();
        if (!newGuardName) return;
        const roleTitles = {
          guard: 'Security Guard',
          supervisor: 'Supervisor',
          night_supervisor: 'Night Supervisor',
          admin: 'System Admin'
        };
        const newUser = {
          id: `usr-${users.length + 1}`,
          name: newGuardName,
          role: newGuardRole,
          title: roleTitles[newGuardRole] || 'Security Staff',
          avatar: newGuardRole === 'night_supervisor' ? '🌙' : newGuardRole === 'supervisor' ? '👔' : '👮'
        };
        setUsers([...users, newUser]);
        setNewGuardName('');
        showNotify(`Added ${newUser.name} to Roster!`);
      };

      // Realtime Camera
      const startCamera = async () => {
        setCameraError(null);
        setCapturedPhoto(null);
        setIsCameraActive(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
          });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          setCameraError("Camera access denied or device has no camera.");
          setIsCameraActive(false);
        }
      };

      const stopCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          const tracks = videoRef.current.srcObject.getTracks();
          tracks.forEach(track => track.stop());
        }
        setIsCameraActive(false);
      };

      const takePhoto = () => {
        if (videoRef.current && canvasRef.current) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const context = canvas.getContext('2d');
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const imageDataUrl = canvas.toDataURL('image/jpeg');
          setCapturedPhoto(imageDataUrl);
          stopCamera();
        }
      };

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const handleAddVisitor = (e) => {
        e.preventDefault();
        if (!visitorName || !visitorHost) return;

        setIsScanningPhoto(true);
        showNotify("🔍 Scanning Face & Requesting Office Verification...");

        setTimeout(() => {
          setIsScanningPhoto(false);
          const newVis = {
            id: `vis-${visitors.length + 1}`,
            name: visitorName,
            company: 'Registered Guest',
            host: visitorHost,
            inTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            photo: capturedPhoto || '👤',
            policeCheck: 'CLEARED (Police Record Verification OK)',
            statusColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
            hostApproval: 'APPROVED BY OFFICE',
            hostApprovalColor: 'text-emerald-400 bg-emerald-950/60 border-emerald-500/30'
          };
          setVisitors([newVis, ...visitors]);
          setVisitorName('');
          setVisitorHost('');
          setVisitorPhone('');
          setCapturedPhoto(null);
          showNotify(`✅ Verified by ${visitorHost}! Digital pass granted.`);
        }, 2000);
      };

      const toggleOfficeApproval = (id) => {
        setVisitors(visitors.map(v => {
          if (v.id === id) {
            const isApproved = v.hostApproval === 'APPROVED BY OFFICE';
            return {
              ...v,
              hostApproval: isApproved ? 'ENTRY DENIED BY HOST' : 'APPROVED BY OFFICE',
              hostApprovalColor: isApproved 
                ? 'text-rose-400 bg-rose-950/60 border-rose-500/30' 
                : 'text-emerald-400 bg-emerald-950/60 border-emerald-500/30'
            };
          }
          return v;
        }));
        showNotify("Office verification status updated!");
      };

      return (
        <div className="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col justify-between overflow-hidden relative">
          
          {/* Floating Notification */}
          {notification && (
            <div className="fixed top-12 left-4 right-4 z-50 p-3 rounded-xl bg-slate-900 border border-amber-500/40 text-amber-300 text-xs shadow-2xl flex items-center gap-2 animate-bounce">
              <Icon name="shield" className="w-4 h-4 flex-shrink-0" />
              <span>{notification}</span>
            </div>
          )}

          {/* AI Biometric Scanning Overlay */}
          {isScanningPhoto && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center border-2 border-emerald-500/50 shadow-[inset_0_0_50px_rgba(16,185,129,0.2)]">
              <div className="w-20 h-20 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
              <h3 className="text-emerald-400 font-bold text-lg font-mono tracking-widest uppercase">AI & Office Check</h3>
              <p className="text-slate-300 text-xs mt-2 font-mono">Running facial scan & calling host office for verification...</p>
            </div>
          )}

          {/* Top Header Bar */}
          <div className="bg-slate-900 border-b border-slate-800 px-4 pt-3 pb-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setShowStaffPicker(!showStaffPicker)}
                className="flex items-center gap-2 text-left bg-slate-950 px-2.5 py-1 rounded-xl border border-slate-800"
              >
                <span className="text-xl">{currentUser.avatar}</span>
                <div>
                  <h3 className="text-xs font-bold text-white flex items-center gap-1">
                    {currentUser.name}
                    <span className="text-[10px] text-amber-400">▼</span>
                  </h3>
                  <p className="text-[9px] text-slate-400">{currentUser.title}</p>
                </div>
              </button>
            </div>

            <button 
              onClick={() => {
                setSosActive(!sosActive);
                showNotify(sosActive ? "SOS Canceled" : "EMERGENCY SOS BROADCASTED!");
              }} 
              className={`text-[10px] font-black px-3 py-1.5 rounded-full animate-pulse transition ${
                sosActive ? 'bg-white text-red-600' : 'bg-red-600 text-white'
              }`}
            >
              🚨 SOS
            </button>
          </div>

          {/* Staff Switcher Modal */}
          {showStaffPicker && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 p-4 flex flex-col justify-end">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-h-[70vh] flex flex-col">
                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                  <h4 className="text-xs font-bold text-white uppercase tracking-wider">Switch Active User</h4>
                  <button onClick={() => setShowStaffPicker(false)} className="text-slate-400 text-xs px-2 py-1 bg-slate-800 rounded-lg">Close</button>
                </div>
                <div className="space-y-1.5 overflow-y-auto">
                  {users.map((u) => (
                    <button
                      key={u.id}
                      onClick={() => {
                        setCurrentUser(u);
                        setShowStaffPicker(false);
                        showNotify(`Switched active profile to ${u.name}`);
                      }}
                      className={`w-full flex items-center justify-between p-3 rounded-xl border text-left text-xs transition ${
                        currentUser.id === u.id ? 'border-amber-500 bg-amber-500/10 text-white' : 'border-slate-800 bg-slate-950 text-slate-400'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="text-lg">{u.avatar}</span>
                        <div>
                          <div className="font-bold text-white">{u.name}</div>
                          <div className="text-[10px] text-slate-400">{u.title}</div>
                        </div>
                      </div>
                      {currentUser.id === u.id && <span className="w-2 h-2 rounded-full bg-amber-500"></span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Main App Body */}
          <div className="flex-1 overflow-y-auto p-4 pb-20">
            
            {/* TAB 1: HOME */}
            {activeTab === 'home' && (
              <div className="space-y-3">
                <div className="bg-slate-900 p-4 border border-slate-800 rounded-2xl space-y-2 shadow-lg">
                  <div className="flex justify-between items-center">
                    <span className="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded uppercase font-mono font-bold">Deployed Property</span>
                    <span className="text-[10px] text-slate-400">{siteDetails.type}</span>
                  </div>
                  <h2 className="font-bold text-white text-base">{siteDetails.name}</h2>
                  <p className="text-xs text-slate-400">{siteDetails.address}</p>
                  <div className="pt-2 border-t border-slate-800 text-xs text-slate-300 flex justify-between">
                    <span>🚪 {siteDetails.gates}</span>
                    <span className="text-amber-400 font-mono">☎️ {siteDetails.helpline}</span>
                  </div>
                </div>

                <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-xs space-y-1">
                  <span className="font-bold text-amber-400 text-[10px] block uppercase">Site Standing Orders:</span>
                  <p className="text-xs text-slate-300 leading-relaxed">{siteDetails.instructions}</p>
                </div>

                {(currentUser.role === 'admin' || currentUser.role === 'supervisor') && (
                  <form onSubmit={handleAddPersonnel} className="bg-slate-900 p-4 border border-slate-800 rounded-2xl space-y-2">
                    <span className="text-xs font-bold text-amber-400 block">Add New Guard / Staff</span>
                    <input 
                      type="text" 
                      placeholder="Personnel Name" 
                      value={newGuardName} 
                      onChange={(e) => setNewGuardName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                    />
                    <div className="flex gap-2">
                      <select 
                        value={newGuardRole} 
                        onChange={(e) => setNewGuardRole(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white flex-1"
                      >
                        <option value="guard">Security Guard</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="night_supervisor">Night Supervisor</option>
                      </select>
                      <button type="submit" className="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">
                        Add
                      </button>
                    </div>
                  </form>
                )}

                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-white uppercase tracking-wider">Active Duty Roster ({users.length})</h4>
                  <div className="space-y-2">
                    {users.map((u) => (
                      <div key={u.id} className="p-3 bg-slate-900 border border-slate-800 rounded-xl flex justify-between items-center text-xs">
                        <div className="flex items-center gap-3">
                          <span className="text-lg">{u.avatar}</span>
                          <span className="font-bold text-white">{u.name}</span>
                        </div>
                        <span className="text-[10px] text-slate-400 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">{u.title}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: EDIT SITE & RETENTION SETTINGS */}
            {activeTab === 'site' && (
              <div className="space-y-3">
                <form onSubmit={handleSaveSiteDetails} className="bg-slate-900 p-4 border border-slate-800 rounded-2xl space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h4 className="text-xs font-bold text-white uppercase tracking-wider">Property & Storage Config</h4>
                    <Icon name="building" className="w-4 h-4 text-amber-500" />
                  </div>

                  {/* Retention Setting */}
                  <div className="space-y-1 bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <label className="text-[10px] text-amber-400 uppercase font-bold block">Log Auto-Save Retention Period</label>
                    <select 
                      value={retentionDays} 
                      onChange={(e) => setRetentionDays(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono mt-1"
                    >
                      <option value="10">10 Days Auto-Retention</option>
                      <option value="20">20 Days Auto-Retention (Recommended for Mobile)</option>
                      <option value="30">30 Days Auto-Retention (Monthly Audit)</option>
                      <option value="60">60 Days Auto-Retention</option>
                      <option value="90">90 Days Maximum Storage</option>
                    </select>
                    <p className="text-[9px] text-slate-400 mt-1">20-30 Days is ideal. Keeps device memory light while keeping monthly audits accessible.</p>
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400 uppercase font-semibold">Property / Site Name</label>
                    <input 
                      type="text" 
                      value={editSite.name} 
                      onChange={(e) => setEditSite({ ...editSite, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                      required
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400 uppercase font-semibold">Property Type</label>
                    <select 
                      value={editSite.type} 
                      onChange={(e) => setEditSite({ ...editSite, type: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    >
                      <option value="18 Storey Commercial Tower">18 Storey Commercial Tower</option>
                      <option value="Residential Society">Residential Society</option>
                      <option value="Commercial Tower">Commercial Tower</option>
                      <option value="Warehouse / Depot">Warehouse / Depot</option>
                      <option value="Hospital Campus">Hospital Campus</option>
                    </select>
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400 uppercase font-semibold">Full Address</label>
                    <input 
                      type="text" 
                      value={editSite.address} 
                      onChange={(e) => setEditSite({ ...editSite, address: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-400 uppercase font-semibold">Gates Setup</label>
                      <input 
                        type="text" 
                        value={editSite.gates} 
                        onChange={(e) => setEditSite({ ...editSite, gates: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-400 uppercase font-semibold">Emergency Helpline</label>
                      <input 
                        type="text" 
                        value={editSite.helpline} 
                        onChange={(e) => setEditSite({ ...editSite, helpline: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                      />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-xs uppercase tracking-wider">
                    Save Config & Auto-Store Data
                  </button>
                </form>
              </div>
            )}

            {/* TAB 3: VISITORS */}
            {activeTab === 'visitors' && (
              <div className="space-y-4">
                <form onSubmit={handleAddVisitor} className="bg-slate-900 p-4 border border-slate-800 rounded-2xl space-y-3 shadow-lg">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span className="text-xs font-bold text-white uppercase tracking-wider">Visitor Registration</span>
                    <span className="text-[9px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-mono">
                      Intercom Active
                    </span>
                  </div>

                  <div className="space-y-2">
                    <label className="text-[10px] text-slate-400 uppercase font-semibold">1. Capture Visitor Face</label>
                    
                    {cameraError ? (
                      <div className="p-3 border border-red-500/30 bg-red-500/10 rounded-xl text-red-400 text-xs text-center">
                        {cameraError}
                      </div>
                    ) : capturedPhoto ? (
                      <div className="relative w-full aspect-square bg-slate-950 rounded-2xl overflow-hidden border-2 border-emerald-500/50">
                        <img src={capturedPhoto} alt="Captured visitor" className="w-full h-full object-cover" />
                        <button 
                          type="button" 
                          onClick={() => { setCapturedPhoto(null); startCamera(); }}
                          className="absolute bottom-3 right-3 bg-slate-900/90 text-white p-2.5 rounded-xl border border-slate-700 shadow-xl"
                        >
                          <Icon name="refresh" className="w-5 h-5" />
                        </button>
                      </div>
                    ) : isCameraActive ? (
                      <div className="relative w-full aspect-square bg-black rounded-2xl overflow-hidden border border-slate-700">
                        <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                        <button 
                          type="button" 
                          onClick={takePhoto}
                          className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-full shadow-2xl text-xs flex items-center gap-2"
                        >
                          <Icon name="camera" className="w-4 h-4" /> Snap Photo
                        </button>
                      </div>
                    ) : (
                      <button 
                        type="button" 
                        onClick={startCamera}
                        className="w-full h-28 border-2 border-dashed border-slate-700 hover:border-amber-500 bg-slate-950 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-slate-400 transition"
                      >
                        <Icon name="camera" className="w-7 h-7 text-amber-500" />
                        <span className="text-xs font-bold text-white">Tap to Open Realtime Camera</span>
                      </button>
                    )}
                    <canvas ref={canvasRef} className="hidden"></canvas>
                  </div>

                  <div className="space-y-2 mt-2 border-t border-slate-800 pt-3">
                    <label className="text-[10px] text-slate-400 uppercase font-semibold">2. Visitor & Target Office</label>
                    <input 
                      type="text" 
                      placeholder="Visitor Full Name" 
                      value={visitorName} 
                      onChange={(e) => setVisitorName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white" 
                      required
                    />

                    <div className="grid grid-cols-2 gap-2">
                      <input 
                        type="text" 
                        placeholder="Phone / Govt ID" 
                        value={visitorPhone} 
                        onChange={(e) => setVisitorPhone(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                      />
                      <input 
                        type="text" 
                        placeholder="Target Office (e.g. Office 402)" 
                        value={visitorHost} 
                        onChange={(e) => setVisitorHost(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" 
                        required
                      />
                    </div>
                  </div>

                  <button 
                    type="submit" 
                    className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition"
                  >
                    Submit & Request Office Approval
                  </button>
                </form>

                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-white uppercase tracking-wider">Active Visitor Passes</h4>
                  <div className="space-y-3">
                    {visitors.map((v) => (
                      <div key={v.id} className="p-3.5 bg-slate-900 border border-slate-800 rounded-2xl space-y-2 shadow-md">
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-3">
                            {v.photo.startsWith('data:image') ? (
                              <img src={v.photo} alt="Visitor" className="w-12 h-12 object-cover rounded-xl border border-slate-700" />
                            ) : (
                              <div className="w-12 h-12 bg-slate-950 border border-slate-700 rounded-xl flex items-center justify-center text-2xl">
                                {v.photo}
                              </div>
                            )}
                            <div>
                              <div className="font-bold text-white text-xs">{v.name}</div>
                              <div className="text-[11px] text-slate-400">{v.company} • Host: {v.host}</div>
                            </div>
                          </div>
                          <span className="text-[10px] text-emerald-400 font-mono bg-emerald-950/60 px-2 py-0.5 rounded-lg border border-emerald-500/20">
                            In: {v.inTime}
                          </span>
                        </div>

                        <div className="flex items-center justify-between gap-2 pt-1">
                          <div className={`p-2 rounded-xl border text-[10px] font-mono flex-1 ${v.hostApprovalColor}`}>
                            <span>🏢 Office Check: </span>
                            <span className="font-bold">{v.hostApproval}</span>
                          </div>
                          <button 
                            type="button"
                            onClick={() => toggleOfficeApproval(v.id)}
                            className="p-2 bg-slate-950 border border-slate-700 hover:border-amber-500 rounded-xl text-[10px] text-slate-300 font-mono"
                          >
                            Toggle
                          </button>
                        </div>

                        <div className={`p-2 rounded-xl border text-[10px] font-mono flex items-center justify-between ${v.statusColor}`}>
                          <span>🛡️ Police Search:</span>
                          <span className="font-bold">{v.policeCheck}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: BASIC PATROLLING DUTIES & CHECKPOINTS */}
            {activeTab === 'patrol' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h4 className="text-xs font-bold text-white uppercase tracking-wider">Patrolling Duties Checklist</h4>
                  <span className="text-xs text-slate-400 font-mono">{scannedPoints.length} / {checkpoints.length} Cleared</span>
                </div>

                <div className="space-y-2">
                  {checkpoints.map((pt, idx) => {
                    const isDone = scannedPoints.includes(pt);
                    return (
                      <button
                        key={idx}
                        onClick={() => handleScan(pt)}
                        className={`w-full p-3.5 rounded-2xl border text-left text-xs flex justify-between items-center transition ${
                          isDone ? 'bg-blue-950/40 border-blue-500/50 text-blue-300' : 'bg-slate-900 border-slate-800 text-slate-300'
                        }`}
                      >
                        <div className="flex items-center gap-2.5">
                          <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${isDone ? 'bg-blue-500 text-white' : 'bg-slate-800 text-slate-400'}`}>
                            {isDone ? '✓' : idx + 1}
                          </span>
                          <span className="font-medium text-xs">{pt}</span>
                        </div>
                        <span className={`text-[10px] px-2.5 py-1 rounded-lg font-mono ${isDone ? 'bg-blue-500 text-white' : 'bg-slate-950 text-slate-400'}`}>
                          {isDone ? 'VERIFIED' : 'TAP SCAN'}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 5: INCIDENTS */}
            {activeTab === 'incidents' && (
              <div className="space-y-3">
                <h4 className="text-xs font-bold text-white uppercase tracking-wider">Recent Security Logs</h4>
                <div className="space-y-2">
                  {incidents.map((inc) => (
                    <div key={inc.id} className="p-3.5 bg-slate-900 border border-slate-800 rounded-2xl text-xs space-y-1">
                      <div className="flex justify-between font-bold text-rose-400">
                        <span>{inc.title}</span>
                        <span className="text-[10px] text-slate-500">{inc.time}</span>
                      </div>
                      <p className="text-[11px] text-slate-400">Location: {inc.location}</p>
                      <span className="text-[10px] text-amber-400 block pt-1 border-t border-slate-800">Reported by: {inc.reporter}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>

          {/* Fixed Bottom Toolbar */}
          <div className="fixed bottom-0 left-0 right-0 grid grid-cols-5 border-t border-slate-800 py-2.5 text-center text-[10px] bg-slate-950/95 backdrop-blur-md z-40">
            <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-amber-500 font-bold' : 'text-slate-500'}>
              <Icon name="home" className="w-5 h-5 mx-auto" />
              <span className="mt-0.5 block">Home</span>
            </button>
            <button onClick={() => setActiveTab('site')} className={activeTab === 'site' ? 'text-amber-500 font-bold' : 'text-slate-500'}>
              <Icon name="cog" className="w-5 h-5 mx-auto" />
              <span className="mt-0.5 block">Site Info</span>
            </button>
            <button onClick={() => setActiveTab('visitors')} className={activeTab === 'visitors' ? 'text-amber-500 font-bold' : 'text-slate-500'}>
              <Icon name="users" className="w-5 h-5 mx-auto" />
              <span className="mt-0.5 block">Visitors</span>
            </button>
            <button onClick={() => setActiveTab('patrol')} className={activeTab === 'patrol' ? 'text-amber-500 font-bold' : 'text-slate-500'}>
              <Icon name="map" className="w-5 h-5 mx-auto" />
              <span className="mt-0.5 block">Patrol</span>
            </button>
            <button onClick={() => setActiveTab('incidents')} className={activeTab === 'incidents' ? 'text-amber-500 font-bold' : 'text-slate-500'}>
              <Icon name="exclamation" className="w-5 h-5 mx-auto" />
              <span className="mt-0.5 block">Logs</span>
            </button>
          </div>

        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
